[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldfeedmonitor-python-example"
version = "0.1.0"
description = "Search the world's news with the World Feed Monitor REST API, from Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
py-modules = ["wfm_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["wfm_client"]
